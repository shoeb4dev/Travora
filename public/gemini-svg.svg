<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C38" />
      <stop offset="100%" stop-color="#033F5C" />
    </linearGradient>

    <!-- Teal/Cyan Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56CCF2" />
      <stop offset="50%" stop-color="#00A699" />
      <stop offset="100%" stop-color="#033F5C" />
    </linearGradient>

    <!-- Orange/Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC857" />
      <stop offset="100%" stop-color="#F2994A" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Favicon Canvas) -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Outer Ring Base -->
  <path opacity="0.9" fill="none" stroke="url(#wingGrad)" stroke-width="20" stroke-linecap="round" d="M 120 280 A 140 140 0 1 1 380 300" />

  <!-- Bird Wing / Dynamic Swoosh Accent -->
  <path fill="url(#wingGrad)" d="M 280 100 C 340 110, 410 160, 420 240 C 370 200, 310 180, 270 190 C 310 160, 330 130, 280 100 Z" />
  
  <!-- Secondary Gold Swoosh / Bird Accent -->
  <path fill="url(#goldGrad)" d="M 390 220 C 415 260, 410 320, 360 360 C 380 320, 385 270, 350 240 C 370 240, 385 230, 390 220 Z" />

  <!-- Compass Star - Main Vertical Point (Top Cyan, Bottom Deep Blue) -->
  <polygon points="256,70 278,256 256,235" fill="#56CCF2" />
  <polygon points="256,70 234,256 256,235" fill="#00A699" />
  <polygon points="256,442 278,256 256,277" fill="#033F5C" />
  <polygon points="256,442 234,256 256,277" fill="#00A699" />

  <!-- Compass Star - Horizontal Points -->
  <polygon points="70,256 256,234 235,256" fill="#00A699" />
  <polygon points="70,256 256,278 235,256" fill="#033F5C" />
  <polygon points="442,256 256,234 277,256" fill="#56CCF2" />
  <polygon points="442,256 256,278 277,256" fill="#00A699" />

  <!-- Center Gold Needle / Diamond Accent -->
  <polygon points="256,210 270,256 256,302 242,256" fill="url(#goldGrad)" />

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
</svg>
